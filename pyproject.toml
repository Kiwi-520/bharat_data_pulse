
[project]
name = "bharat-data-pulse"
version = "0.1.0"
description = "Agri-Market Intelligence and Mandi Analytics Suite"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Disha Holmukhe", email = "dishaholmukhe521@gmail.com" }
]
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pandas",
    "requests",
    "mysql-connector-python",
    "python-dotenv",
    "plotly>=6.0.0",
]

[project.scripts]
bharat-data-pulse = "bharat_data_pulse:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["bharat_data_pulse"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.poetry]
package-mode = false
